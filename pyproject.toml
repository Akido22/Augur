[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "augur"
version = "0.2.0"
description = "Augur — гибридная торговая система ML+LLM (Форекс, крипто, акции)"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Artem" }]
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "fastapi",
    "uvicorn[standard]",
    "typer",
    "sqlalchemy>=2",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]
# Опционально: для этапа 0.10.0 (ML-модели). На этапе 0.1.0 не используется.
ml = [
    "lightgbm",
    "scikit-learn",
    "pandas",
    "numpy",
]
# SDK площадок (0.2.0): импортируются лениво при connect(); тесты работают без них.
ccxt = ["ccxt>=4"]
alpaca = ["alpaca-py>=0.30"]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]  # только Windows + запущенный терминал

[project.scripts]
augur = "augur.interfaces.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
# Примеры кода в спецификациях и skills — документация, а не исходники проекта.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_configs = true